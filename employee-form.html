<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Employee — ERP Management App</title>
    <script>if (!localStorage.getItem('erp_session')) window.location.href = 'login.html';</script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="employees.css">
</head>
<body>

<nav class="app-nav">
    <div class="nav-content">
        <img src="logo.png" alt="ERP Logo" class="nav-logo" onerror="this.src='https://placehold.co/42x42/059669/white?text=ERP'">
        <h1>ERP Management App</h1>
        <span class="module-tag" id="modeTag">Add Employee</span>
    </div>
</nav>

<div class="page-wrap">
    <a href="employees.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Directory
    </a>

    <div class="page-header">
        <div>
            <h2 id="pageTitle">Add New Employee</h2>
            <p class="subtitle" id="pageSubtitle">Fill in worker details to create a new profile.</p>
        </div>
    </div>

    <div class="form-card">
        <form id="empForm" onsubmit="handleSubmit(event)">

            <div class="form-section-title">Basic Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required placeholder="e.g. Ramesh Kumar">
                </div>
                <div class="form-group">
                    <label for="role">Role / Trade *</label>
                    <select id="role" required>
                        <option value="">Select role</option>
                        <option>Mason</option>
                        <option>Helper</option>
                        <option>Electrician</option>
                        <option>Plumber</option>
                        <option>Carpenter</option>
                        <option>Painter</option>
                        <option>Site Supervisor</option>
                        <option>Site Engineer</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required placeholder="+91-XXXXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="active">Active</option>
                        <option value="on_leave">On Leave</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label for="address">Address</label>
                    <textarea id="address" placeholder="Permanent address"></textarea>
                </div>
            </div>

            <div class="form-section-title">Site & Department Assignment</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="site_id">Assigned Site *</label>
                    <select id="site_id" required></select>
                </div>
                <div class="form-group">
                    <label for="department_id">Department</label>
                    <select id="department_id">
                        <option value="">— Select department —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="joining_date">Joining Date *</label>
                    <input type="date" id="joining_date" required>
                </div>
                <div class="form-group">
                    <label for="wage_per_day">Daily Wage (₹) *</label>
                    <input type="number" id="wage_per_day" required min="0" placeholder="e.g. 750">
                </div>
            </div>

            <div class="form-section-title">ID & Bank Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="aadhaar">Aadhaar Number</label>
                    <input type="text" id="aadhaar" placeholder="XXXX-XXXX-XXXX">
                </div>
                <div class="form-group">
                    <label for="bank_account">Bank Account</label>
                    <input type="text" id="bank_account" placeholder="e.g. SBI - XXXX1234">
                    <span class="hint">Bank name + last 4 digits is enough</span>
                </div>
                <div class="form-group full">
                    <label for="emergency_contact">Emergency Contact</label>
                    <input type="text" id="emergency_contact" placeholder="Phone + relationship">
                </div>
            </div>

            <div class="form-actions">
                <a href="employees.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">Save Employee</button>
            </div>
        </form>
    </div>
</div>

<script src="data.js"></script>
<script>
    Auth.requireAuth();

    const empId  = getQueryParam('id');
    const isEdit = !!empId;

    (async () => {
        const [sites, depts] = await Promise.all([API.getSites(), API.getDepartments()]);

        const siteSelect = document.getElementById('site_id');
        siteSelect.innerHTML = '<option value="">Select site</option>' +
            sites.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

        const deptSelect = document.getElementById('department_id');
        deptSelect.innerHTML = '<option value="">— Select department —</option>' +
            depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

        if (isEdit) {
            const emp = await API.getEmployee(empId);
            if (emp) {
                document.getElementById('modeTag').textContent     = 'Edit Employee';
                document.getElementById('pageTitle').textContent    = `Edit ${emp.name}`;
                document.getElementById('pageSubtitle').textContent = `Update details for ${emp.id}`;
                document.getElementById('submitBtn').textContent    = 'Save Changes';
                document.getElementById('name').value              = emp.name;
                document.getElementById('role').value              = emp.role;
                document.getElementById('phone').value             = emp.phone;
                document.getElementById('status').value            = emp.status;
                document.getElementById('address').value           = emp.address || '';
                document.getElementById('site_id').value           = emp.site_id;
                document.getElementById('department_id').value     = emp.department_id || '';
                document.getElementById('joining_date').value      = emp.joining_date;
                document.getElementById('wage_per_day').value      = emp.wage_per_day;
                document.getElementById('aadhaar').value           = emp.aadhaar || '';
                document.getElementById('bank_account').value      = emp.bank_account || '';
                document.getElementById('emergency_contact').value = emp.emergency_contact || '';
            }
        } else {
            document.getElementById('joining_date').value = new Date().toISOString().split('T')[0];
        }
    })();

    async function handleSubmit(e) {
        e.preventDefault();
        const data = {
            name:              document.getElementById('name').value.trim(),
            role:              document.getElementById('role').value,
            phone:             document.getElementById('phone').value.trim(),
            status:            document.getElementById('status').value,
            address:           document.getElementById('address').value.trim(),
            site_id:           parseInt(document.getElementById('site_id').value),
            department_id:     parseInt(document.getElementById('department_id').value) || null,
            joining_date:      document.getElementById('joining_date').value,
            wage_per_day:      parseInt(document.getElementById('wage_per_day').value),
            aadhaar:           document.getElementById('aadhaar').value.trim(),
            bank_account:      document.getElementById('bank_account').value.trim(),
            emergency_contact: document.getElementById('emergency_contact').value.trim()
        };

        if (isEdit) {
            await API.updateEmployee(empId, data);
            window.location.href = `employee-detail.html?id=${empId}`;
        } else {
            const newEmp = await API.addEmployee(data);
            window.location.href = `employee-detail.html?id=${newEmp.id}`;
        }
    }
</script>
</body>
</html>
