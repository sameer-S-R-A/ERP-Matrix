<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile — ERP Management App</title>
    <script>if (!localStorage.getItem('erp_session')) window.location.href = 'login.html';</script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="employees.css">
</head>
<body>

<nav class="app-nav">
    <div class="nav-content">
        <img src="logo.png" alt="ERP Logo" class="nav-logo" onerror="this.src='https://placehold.co/42x42/059669/white?text=ERP'">
        <h1>ERP Management App</h1>
        <span class="module-tag">Employee Profile</span>
    </div>
</nav>

<div class="page-wrap">

    <a href="employees.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Directory
    </a>

    <div id="content"></div>

</div>

<script src="data.js"></script>
<script>
    Auth.requireAuth();

    const empId    = getQueryParam('id');
    const emp      = DB.getEmployee(empId);
    const content  = document.getElementById('content');

    if (!emp) {
        content.innerHTML = `
            <div class="empty-state">
                <p>Employee not found.</p>
                <a href="employees.html" class="btn btn-primary" style="margin-top:16px;">Return to directory</a>
            </div>`;
    } else {
        const site     = DB.getSite(emp.site_id);
        const dept     = DB.getDepartment(emp.department_id);
        const attendance = DB.getAttendance(emp.id);
        const attStats   = DB.getAttendanceStats(emp.id);
        const payments   = DB.getPayments(emp.id);
        const totalPaid  = DB.getTotalPaid(emp.id);
        const documents  = DB.getDocuments(emp.id);

        content.innerHTML = `
            <div class="page-header">
                <div>
                    <h2>${emp.name}</h2>
                    <p class="subtitle">${emp.role} · ${emp.id} · ${site ? site.name : '—'}</p>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <a href="admin.html?section=relocate&emp=${emp.id}" class="btn btn-secondary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                        Relocate
                    </a>
                    <a href="employee-form.html?id=${emp.id}" class="btn btn-secondary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        Edit
                    </a>
                    <button class="btn btn-danger" onclick="archiveEmployee()">Archive</button>
                </div>
            </div>

            <div class="detail-grid">
                <!-- Sidebar -->
                <aside class="detail-sidebar">
                    <div class="detail-avatar">${getInitials(emp.name)}</div>
                    <h2>${emp.name}</h2>
                    <div class="role">${emp.role}</div>
                    ${statusBadge(emp.status)}

                    <ul class="info-list">
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                            <div><span class="lbl">Phone</span><span class="val">${emp.phone}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
                            <div><span class="lbl">Site</span><span class="val">${site ? site.name : '—'}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></span>
                            <div><span class="lbl">Department</span><span class="val">${dept ? dept.name : '—'}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
                            <div><span class="lbl">Joined</span><span class="val">${formatDate(emp.joining_date)}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></span>
                            <div><span class="lbl">Daily Wage</span><span class="val">${formatCurrency(emp.wage_per_day)}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
                            <div><span class="lbl">Address</span><span class="val">${emp.address}</span></div>
                        </li>
                        <li>
                            <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                            <div><span class="lbl">Emergency Contact</span><span class="val">${emp.emergency_contact}</span></div>
                        </li>
                    </ul>
                </aside>

                <!-- Main: tabs -->
                <div class="detail-main">
                    <div class="tab-bar">
                        <button class="tab-btn active" data-tab="overview">Overview</button>
                        <button class="tab-btn" data-tab="attendance">Attendance (${attendance.length})</button>
                        <button class="tab-btn" data-tab="payments">Payments (${payments.length})</button>
                        <button class="tab-btn" data-tab="documents">Documents (${documents.length})</button>
                    </div>

                    <div class="tab-content">
                        <!-- Overview -->
                        <div class="tab-pane active" id="tab-overview">
                            <div class="stats-row" style="margin-bottom:0;">
                                <div class="stat-card green"><div class="label">Days Present</div><div class="value">${attStats.present}</div></div>
                                <div class="stat-card"><div class="label">Total Hours</div><div class="value">${attStats.total_hours}</div></div>
                                <div class="stat-card blue"><div class="label">Total Paid</div><div class="value" style="font-size:1.5rem;">${formatCurrency(totalPaid)}</div></div>
                                <div class="stat-card red"><div class="label">Days Absent</div><div class="value">${attStats.absent}</div></div>
                            </div>
                            <h3 class="form-section-title" style="margin-top:24px;">Bank & ID Details</h3>
                            <ul class="info-list">
                                <li><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></span><div><span class="lbl">Bank Account</span><span class="val">${emp.bank_account}</span></div></li>
                                <li><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/></svg></span><div><span class="lbl">Aadhaar</span><span class="val">${emp.aadhaar}</span></div></li>
                            </ul>
                        </div>

                        <!-- Attendance -->
                        <div class="tab-pane" id="tab-attendance">
                            ${attendance.length === 0
                                ? `<div class="empty-state"><p>No attendance records yet.</p></div>`
                                : `<table class="data-table"><thead><tr><th>Date</th><th>Status</th><th>Hours</th></tr></thead><tbody>
                                    ${attendance.map(a => `<tr><td>${formatDate(a.date)}</td><td>${attendanceBadge(a.status)}</td><td>${a.hours} hrs</td></tr>`).join('')}
                                </tbody></table>`}
                        </div>

                        <!-- Payments -->
                        <div class="tab-pane" id="tab-payments">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
                                <div><strong>Total Paid: ${formatCurrency(totalPaid)}</strong></div>
                                <a href="payments.html?emp=${emp.id}" class="btn btn-primary">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                    Record Payment
                                </a>
                            </div>
                            ${payments.length === 0
                                ? `<div class="empty-state"><p>No payments recorded yet.</p></div>`
                                : `<table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody>
                                    ${payments.map(p => `<tr>
                                        <td>${formatDate(p.date)}</td>
                                        <td><span class="badge ${p.type === 'advance' ? 'badge-onleave' : 'badge-active'}">${p.type.replace('_', ' ')}</span></td>
                                        <td><strong>${formatCurrency(p.amount)}</strong></td>
                                        <td style="color:var(--text-muted);">${p.note}</td>
                                    </tr>`).join('')}
                                </tbody></table>`}
                        </div>

                        <!-- Documents -->
                        <div class="tab-pane" id="tab-documents">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                                <div style="color:var(--text-muted);font-size:0.9rem;">${documents.length} file${documents.length !== 1 ? 's' : ''} uploaded</div>
                                <button class="btn btn-primary" onclick="alert('Connect cloud storage to enable document uploads.')">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Upload Document
                                </button>
                            </div>
                            ${documents.length === 0
                                ? `<div class="empty-state"><p>No documents uploaded yet.</p></div>`
                                : `<div class="doc-grid">${documents.map(d => `
                                    <a href="#" class="doc-card" onclick="event.preventDefault();">
                                        <div class="doc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                                        <div><div class="doc-name">${d.type}</div><div class="doc-meta">${d.filename} · ${d.size}</div></div>
                                        <div class="doc-meta">Uploaded ${formatDate(d.uploaded)}</div>
                                    </a>`).join('')}</div>`}
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
    }

    function archiveEmployee() {
        if (!confirm(`Archive ${emp.name}? Their status will be set to Inactive.`)) return;
        DB.updateEmployee(emp.id, { status: 'inactive' });
        alert(`${emp.name} has been archived.`);
        window.location.href = 'employees.html';
    }
</script>
</body>
</html>
