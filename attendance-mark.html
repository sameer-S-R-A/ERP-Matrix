<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance — ERP Management App</title>
    <script>if (!localStorage.getItem('erp_session')) window.location.href = 'login.html';</script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="employees.css">
    <style>
        .att-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .att-row:hover { box-shadow: var(--shadow-sm); }
        .att-row .who { display: flex; align-items: center; gap: 12px; }
        .att-row .emp-avatar { width: 40px; height: 40px; font-size: 0.9rem; flex-shrink: 0; }
        .att-options { display: flex; gap: 6px; flex-wrap: wrap; }
        .att-pill {
            padding: 7px 14px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            color: var(--text-muted);
        }
        .att-pill:hover { border-color: var(--text-light); }
        .att-pill.selected.present  { background: var(--accent-green); color: white; border-color: var(--accent-green); }
        .att-pill.selected.half_day { background: #d97706; color: white; border-color: #d97706; }
        .att-pill.selected.absent   { background: var(--primary); color: white; border-color: var(--primary); }
        @media (max-width: 600px) {
            .att-row { grid-template-columns: 1fr; }
            .att-options { justify-content: flex-start; }
        }
    </style>
</head>
<body>

<nav class="app-nav">
    <div class="nav-content">
        <img src="logo.png" alt="ERP Logo" class="nav-logo" onerror="this.src='https://placehold.co/42x42/059669/white?text=ERP'">
        <h1>ERP Management App</h1>
        <span class="module-tag">Mark Attendance</span>
    </div>
</nav>

<div class="page-wrap">
    <a href="employees.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Directory
    </a>

    <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
            <h2>Mark Attendance</h2>
            <p class="subtitle">Tap each worker to mark Present, Half Day, or Absent.</p>
        </div>
        <a href="attendance-report.html" class="btn btn-primary" id="btnReport" style="display:flex; align-items:center; gap:6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Monthly Record & Overview
        </a>
    </div>

    <div class="filter-bar">
        <div class="form-group" style="flex-grow:1;min-width:180px;">
            <label for="dateInput" style="font-size:0.8rem;color:var(--text-muted);">Date</label>
            <input type="date" id="dateInput" class="filter-select" style="padding:10px 14px;">
        </div>
        <div class="form-group" style="flex-grow:1;min-width:180px;">
            <label for="siteInput" style="font-size:0.8rem;color:var(--text-muted);">Site</label>
            <select id="siteInput" class="filter-select" onchange="render()"></select>
        </div>
        <div style="display:flex; gap:10px; align-items:flex-end;">
            <button class="btn btn-secondary" onclick="markAll('present')">Mark All Present</button>
            <label class="btn btn-secondary" style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Import
                <input type="file" accept=".csv, .xlsx, .xls" style="display:none;" onchange="handleImport(event)">
            </label>
        </div>
    </div>

    <div id="rows"></div>

    <div class="form-actions" style="border-top:none;margin-top:8px;padding:0;">
        <a href="employees.html" class="btn btn-secondary">Cancel</a>
        <button class="btn btn-primary" onclick="saveAttendance()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Save Attendance
        </button>
    </div>
</div>

<script src="data.js"></script>
<script>
    Auth.requireAuth();

    const dateInput = document.getElementById('dateInput');
    const siteInput = document.getElementById('siteInput');
    const rowsEl    = document.getElementById('rows');

    dateInput.value = new Date().toISOString().split('T')[0];

    const presetSite = getQueryParam('site');
    (async () => {
        const sites = await API.getSites();
        sites.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id; opt.textContent = s.name;
            if (presetSite && s.id == presetSite) opt.selected = true;
            siteInput.appendChild(opt);
        });
        await render();
        if(siteInput.value) document.getElementById('btnReport').href = 'attendance-report.html?site=' + siteInput.value;
    })();

    const state = {}; // emp_id → status

    async function render() {
        Object.keys(state).forEach(k => delete state[k]);
        const [activeEmps, leaveEmps] = await Promise.all([
            API.getEmployees({ site_id: siteInput.value, status: 'active' }),
            API.getEmployees({ site_id: siteInput.value, status: 'on_leave' })
        ]);
        const emps = [...activeEmps, ...leaveEmps];
        if (emps.length === 0) {
            rowsEl.innerHTML = '<div class="empty-state"><p>No active workers at this site.</p></div>';
            return;
        }
        rowsEl.innerHTML = emps.map(e => `
            <div class="att-row" data-id="${e.id}">
                <div class="who">
                    <div class="emp-avatar">${getInitials(e.name)}</div>
                    <div>
                        <div style="font-weight:600;">${e.name}</div>
                        <div style="font-size:0.85rem;color:var(--text-muted);">${e.role} · ${e.id}</div>
                    </div>
                </div>
                <div class="att-options">
                    <button class="att-pill" data-status="present"  onclick="setStatus('${e.id}','present')">Present</button>
                    <button class="att-pill" data-status="half_day" onclick="setStatus('${e.id}','half_day')">Half Day</button>
                    <button class="att-pill" data-status="absent"   onclick="setStatus('${e.id}','absent')">Absent</button>
                </div>
            </div>`).join('');
    }

    siteInput.addEventListener('change', () => {
        document.getElementById('btnReport').href = 'attendance-report.html?site=' + siteInput.value;
        render();
    });

    function setStatus(empId, status) {
        state[empId] = status;
        const row = document.querySelector(`.att-row[data-id="${empId}"]`);
        row.querySelectorAll('.att-pill').forEach(p => {
            p.classList.remove('selected', 'present', 'half_day', 'absent');
            if (p.dataset.status === status) p.classList.add('selected', status);
        });
    }

    function markAll(status) {
        document.querySelectorAll('.att-row').forEach(r => setStatus(r.dataset.id, status));
    }

    function handleImport(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        if (confirm(`Upload and import monthly attendance from "${file.name}"?`)) {
            // Simulate processing for UI
            alert('File accepted. Monthly attendance records are being synchronized...');
            setTimeout(() => {
                alert('✓ Import completed successfully!');
                event.target.value = ''; // reset input
            }, 500);
        } else {
            event.target.value = ''; // reset input
        }
    }

    async function saveAttendance() {
        const marked = Object.keys(state).length;
        const total  = document.querySelectorAll('.att-row').length;
        if (marked === 0) { alert('No attendance marked yet.'); return; }

        const date    = dateInput.value;
        const records = Object.entries(state).map(([emp_id, status]) => ({
            emp_id, date, status,
            hours: status === 'present' ? 9 : status === 'half_day' ? 4 : 0
        }));
        await API.saveAttendanceBatch(records);
        alert(`Attendance saved for ${marked} of ${total} workers on ${formatDate(date)}.`);
        window.location.href = 'employees.html';
    }
</script>
</body>
</html>
